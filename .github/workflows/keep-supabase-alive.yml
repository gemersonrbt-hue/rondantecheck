name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer uma requisição leve ao Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://goervszeptqonzonyxdm.supabase.co/rest/v1/inspecoes_campo?select=usina_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
